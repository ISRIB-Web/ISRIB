<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISRIB 2026</title>

<style>

/* ===== GENERAL ===== */
body{
font-family: Arial;
margin:0;
background:#f5f7fa;
}

/* ===== HEADER ===== */
header{
background:#1F5AA6;
color:white;
text-align:center;
padding:60px;
}

.logo{
width:200px;
border-radius:50%;
}

/* ===== CARRUSEL ===== */
.carousel{
display:flex;
align-items:center;
justify-content:center;
margin:40px;
}

.wrapper{
overflow:hidden;
width:80%;
}

.track{
display:flex;
transition:0.5s;
}

.slide{
min-width:100%;
display:flex;
gap:20px;
justify-content:center;
}

/* ===== CARDS ===== */
.card{
background:white;
padding:20px;
border-radius:10px;
width:250px;
text-align:center;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

.card img{
width:120px;
height:120px;
border-radius:50%;
}

/* ===== BOTONES ===== */
button{
background:#1F5AA6;
color:white;
border:none;
padding:10px;
cursor:pointer;
}

/* ===== DOTS ===== */
.dots{
text-align:center;
}

.dot{
width:10px;
height:10px;
background:#ccc;
display:inline-block;
margin:5px;
border-radius:50%;
cursor:pointer;
}

.active{
background:#1F5AA6;
}

</style>

</head>

<body>

<header>
<img src="logo_isrib.jpeg" class="logo">
<h1>ISRIB 2026</h1>
</header>

<!-- ===================== -->
<!-- COMITÉ -->
<!-- ===================== -->
<h2 style="text-align:center;">Comité</h2>

<div class="carousel">

<button onclick="move(-1,'comite')">◀</button>

<div class="wrapper">
<div class="track" id="comite">

<!-- SLIDE 1 -->
<div class="slide">

<!-- 👇 EDITA AQUÍ -->
<div class="card">
<img src="ISRIB/miembros/prueba1.jpg">
<h3>Nombre</h3>
<p>Rol + descripción</p>
</div>

<div class="card">
<img src="ISRIB/miembros/prueba1.jpg">
<h3>Nombre</h3>
<p>Rol + descripción</p>
</div>

<div class="card">
<img src="ISRIB/miembros/prueba1.jpg">
<h3>Nombre</h3>
<p>Rol + descripción</p>
</div>

</div>

<!-- 👉 DUPLICA ESTE BLOQUE PARA MÁS PERSONAS -->
<div class="slide">
<div class="card"><img src="ISRIB/miembros/prueba1.jpg"><h3>Nombre</h3><p>Desc</p></div>
<div class="card"><img src="ISRIB/miembros/prueba1.jpg"><h3>Nombre</h3><p>Desc</p></div>
<div class="card"><img src="ISRIB/miembros/prueba1.jpg"><h3>Nombre</h3><p>Desc</p></div>
</div>

</div>
</div>

<button onclick="move(1,'comite')">▶</button>

</div>

<div class="dots" id="dots-comite"></div>

<!-- ===================== -->
<!-- PONENTES -->
<!-- ===================== -->
<h2 style="text-align:center;">Ponentes</h2>

<div class="carousel">

<button onclick="move(-1,'ponentes')">◀</button>

<div class="wrapper">
<div class="track" id="ponentes">

<!-- SLIDE -->
<div class="slide">

<!-- 👇 EDITA AQUÍ -->
<div class="card">
<h3>Ponente</h3>
<p>Universidad<br><b>Tema</b></p>
</div>

<div class="card">
<h3>Ponente</h3>
<p>Universidad<br><b>Tema</b></p>
</div>

</div>

<!-- 👉 DUPLICA PARA MÁS -->
<div class="slide">
<div class="card"><h3>Ponente</h3></div>
<div class="card"><h3>Ponente</h3></div>
</div>

</div>
</div>

<button onclick="move(1,'ponentes')">▶</button>

</div>

<div class="dots" id="dots-ponentes"></div>

<script>

/* ===== SLIDER SIMPLE ===== */
let sliders = {
comite:0,
ponentes:0
};

function init(id){
let track = document.getElementById(id);
let dots = document.getElementById("dots-"+id);

for(let i=0;i<track.children.length;i++){
let d=document.createElement("span");
d.className="dot";
if(i===0)d.classList.add("active");

d.onclick=()=>go(i,id);
dots.appendChild(d);
}
}

function move(dir,id){
let track=document.getElementById(id);
let total=track.children.length;

sliders[id]+=dir;

if(sliders[id]<0)sliders[id]=0;
if(sliders[id]>=total)sliders[id]=total-1;

track.style.transform=`translateX(-${sliders[id]*100}%)`;

update(id);
}

function go(i,id){
sliders[id]=i;
document.getElementById(id).style.transform=`translateX(-${i*100}%)`;
update(id);
}

function update(id){
let dots=document.querySelectorAll("#dots-"+id+" .dot");
dots.forEach(d=>d.classList.remove("active"));
dots[sliders[id]].classList.add("active");
}

init("comite");
init("ponentes");

</script>

</body>
</html>
