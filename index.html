<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Test Slider</title>

<style>
body{font-family:Arial}

/* CARRUSEL */
.carousel{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}

.carousel-wrapper{
overflow:hidden;
width:600px;
border:2px solid red; /* 👈 PARA VER SI FUNCIONA */
}

.carousel-track{
display:flex;
transition:0.5s;
}

.grupo{
min-width:100%;
display:flex;
gap:10px;
}

.card{
background:#eee;
padding:20px;
flex:1;
text-align:center;
}

button{padding:10px;}

.dot{
width:10px;
height:10px;
background:#ccc;
display:inline-block;
margin:5px;
border-radius:50%;
cursor:pointer;
}

.active{background:black;}

</style>
</head>

<body>

<h2>Slider prueba</h2>

<div class="carousel">

<button onclick="mover(-1)">◀</button>

<div class="carousel-wrapper">
<div class="carousel-track" id="slider">

<div class="grupo">
<div class="card">1</div>
<div class="card">2</div>
</div>

<div class="grupo">
<div class="card">3</div>
<div class="card">4</div>
</div>

<div class="grupo">
<div class="card">5</div>
<div class="card">6</div>
</div>

</div>
</div>

<button onclick="mover(1)">▶</button>

</div>

<div id="dots"></div>

<script>

let index=0;

function init(){
let total=document.getElementById("slider").children.length;
let dots=document.getElementById("dots");

for(let i=0;i<total;i++){
let d=document.createElement("span");
d.className="dot";
if(i===0)d.classList.add("active");

d.onclick=()=>irA(i);
dots.appendChild(d);
}
}

function mover(dir){
let track=document.getElementById("slider");
let total=track.children.length;

index+=dir;

if(index<0)index=0;
if(index>=total)index=total-1;

track.style.transform=`translateX(-${index*100}%)`;

actualizar();
}

function irA(i){
index=i;
document.getElementById("slider").style.transform=`translateX(-${i*100}%)`;
actualizar();
}

function actualizar(){
let dots=document.querySelectorAll(".dot");
dots.forEach(d=>d.classList.remove("active"));
dots[index].classList.add("active");
}

init();

</script>

</body>
</html>
